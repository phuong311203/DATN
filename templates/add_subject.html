<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm môn học</title>
</head>
<body>
    <h1>Thêm môn học</h1>

    <!-- Hiển thị thông báo -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul>
            {% for category, message in messages %}
                <li class="{{ category }}">{{ message }}</li>
            {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <form method="POST" action="/add_subject">
        <label for="subject_name">Tên môn học:</label>
        <input type="text" id="subject_name" name="subject_name" required><br>

        <button type="submit">Thêm môn học</button>
    </form>

    <a href="/">Trở lại trang chủ</a>
</body>
</html>
